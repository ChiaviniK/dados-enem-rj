<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ENEM - Rio de Janeiro</title>
    <!-- Tailwind CSS para Estilização Rápida e Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para Visualização de Dados -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Estilos complementares leves */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .chart-container-large { position: relative; height: 400px; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Menu Lateral (Filtros) -->
    <aside class="w-64 bg-white shadow-lg flex flex-col z-10 hidden md:flex">
        <div class="p-6 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-800">ENEM - RJ</h1>
            <p class="text-sm text-gray-500">Dashboard de Desempenho</p>
        </div>
        <div class="p-6 flex-1">
            <h2 class="text-sm font-semibold text-gray-600 uppercase tracking-wider mb-4">Filtros</h2>
            
            <div class="mb-4">
                <label for="regionFilter" class="block text-sm font-medium text-gray-700 mb-1">Região</label>
                <select id="regionFilter" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="Todas">Todas as Regiões</option>
                    <option value="Zona Sul">Zona Sul</option>
                    <option value="Zona Norte">Zona Norte</option>
                    <option value="Zona Oeste">Zona Oeste</option>
                    <option value="Centro">Centro</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="schoolFilter" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Escola</label>
                <select id="schoolFilter" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="Todas">Todas</option>
                    <option value="Pública">Pública</option>
                    <option value="Privada">Privada</option>
                </select>
            </div>
            
            <button id="resetFilters" class="w-full bg-blue-50 text-blue-600 hover:bg-blue-100 py-2 rounded-md text-sm font-medium transition-colors">
                Limpar Filtros
            </button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <div class="p-8">
            
            <!-- Cards de KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500 font-medium">Média Geral (Global)</p>
                    <p id="kpi-geral" class="text-3xl font-bold text-gray-800 mt-2">--</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
                    <p class="text-sm text-gray-500 font-medium">Média Matemática</p>
                    <p id="kpi-matematica" class="text-3xl font-bold text-gray-800 mt-2">--</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 border-l-4 border-yellow-500">
                    <p class="text-sm text-gray-500 font-medium">Média Redação</p>
                    <p id="kpi-redacao" class="text-3xl font-bold text-gray-800 mt-2">--</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
                    <p class="text-sm text-gray-500 font-medium">Total de Alunos</p>
                    <p id="kpi-total" class="text-3xl font-bold text-gray-800 mt-2">--</p>
                </div>
            </div>

            <!-- Gráficos -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <!-- Gráfico de Barras -->
                <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Desempenho por Área de Conhecimento e Região</h3>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>

                <!-- Gráfico de Rosca -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Proporção por Tipo de Escola</h3>
                    <div class="chart-container">
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Gráfico Scatter -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Dispersão: Matemática vs Redação</h3>
                <div class="chart-container-large">
                    <canvas id="scatterChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <script>
        /**
         * 1. GERAÇÃO DE DADOS (MOCK)
         * Simula 200 alunos com viés demográfico (Zona Sul e Escolas Privadas com notas levemente maiores).
         */
        const generateMockData = (numRecords = 200) => {
            const data = [];
            const regions = ["Zona Sul", "Zona Norte", "Zona Oeste", "Centro"];
            const schools = ["Pública", "Privada"];

            for (let i = 1; i <= numRecords; i++) {
                const region = regions[Math.floor(Math.random() * regions.length)];
                const school = schools[Math.floor(Math.random() * schools.length)];
                
                // Base de nota com viés socioeconômico (simulando a desigualdade real)
                let baseScore = 450 + (Math.random() * 200); 
                if (school === "Privada") baseScore += 90;
                if (region === "Zona Sul") baseScore += 60;
                if (region === "Centro") baseScore += 20;

                // Função auxiliar para manter notas entre 0 e 1000
                const clamp = (val) => Math.min(1000, Math.max(0, val));

                // Gerando notas com variação baseada na baseScore
                const cn = clamp(baseScore + (Math.random() * 120 - 60));
                const ch = clamp(baseScore + (Math.random() * 100 - 50));
                const lc = clamp(baseScore + (Math.random() * 90 - 45));
                const mt = clamp(baseScore + (Math.random() * 180 - 90)); // Matemática costuma ter maior variância
                
                // Redação é avaliada em múltiplos de 20
                let redacaoRaw = clamp(baseScore + 50 + (Math.random() * 200 - 100));
                const redacao = Math.round(redacaoRaw / 20) * 20;

                data.push({
                    NU_INSCRICAO: `2024${String(i).padStart(6, '0')}`,
                    REGIAO_RJ: region,
                    TP_ESCOLA: school,
                    NU_NOTA_CN: parseFloat(cn.toFixed(1)),
                    NU_NOTA_CH: parseFloat(ch.toFixed(1)),
                    NU_NOTA_LC: parseFloat(lc.toFixed(1)),
                    NU_NOTA_MT: parseFloat(mt.toFixed(1)),
                    NU_NOTA_REDACAO: redacao
                });
            }
            return data;
        };

        const rawData = generateMockData(300);

        /**
         * 2. VARIÁVEIS GLOBAIS E CORES DO GRÁFICO
         */
        let filteredData = [...rawData];
        
        // Paletas padronizadas
        const regionColors = {
            "Zona Sul": { bg: 'rgba(59, 130, 246, 0.7)', border: 'rgb(59, 130, 246)' },
            "Zona Norte": { bg: 'rgba(239, 68, 68, 0.7)', border: 'rgb(239, 68, 68)' },
            "Zona Oeste": { bg: 'rgba(16, 185, 129, 0.7)', border: 'rgb(16, 185, 129)' },
            "Centro": { bg: 'rgba(245, 158, 11, 0.7)', border: 'rgb(245, 158, 11)' }
        };

        const schoolColors = {
            "Pública": { bg: 'rgba(139, 92, 246, 0.8)', border: 'rgb(139, 92, 246)' },
            "Privada": { bg: 'rgba(20, 184, 166, 0.8)', border: 'rgb(20, 184, 166)' }
        };

        // Instâncias do Chart.js
        let barChartInstance, doughnutChartInstance, scatterChartInstance;

        /**
         * 3. FUNÇÕES DE CÁLCULO (REDUCE, MAP, FILTER)
         */
        const calculateAverage = (arr, key) => {
            if (arr.length === 0) return 0;
            const sum = arr.reduce((acc, curr) => acc + curr[key], 0);
            return (sum / arr.length).toFixed(1);
        };

        const getGlobalAverage = (arr) => {
            if (arr.length === 0) return 0;
            const total = arr.reduce((acc, curr) => 
                acc + curr.NU_NOTA_CN + curr.NU_NOTA_CH + curr.NU_NOTA_LC + curr.NU_NOTA_MT + curr.NU_NOTA_REDACAO, 0);
            return (total / (arr.length * 5)).toFixed(1);
        };

        /**
         * 4. ATUALIZAÇÃO DA INTERFACE (DOM)
         */
        const updateKPIs = () => {
            document.getElementById('kpi-geral').innerText = getGlobalAverage(filteredData);
            document.getElementById('kpi-matematica').innerText = calculateAverage(filteredData, 'NU_NOTA_MT');
            document.getElementById('kpi-redacao').innerText = calculateAverage(filteredData, 'NU_NOTA_REDACAO');
            document.getElementById('kpi-total').innerText = filteredData.length;
        };

        const updateCharts = () => {
            // 4.1 Processar Dados para Bar Chart (Médias por Matéria por Região)
            const subjects = ['NU_NOTA_CN', 'NU_NOTA_CH', 'NU_NOTA_LC', 'NU_NOTA_MT', 'NU_NOTA_REDACAO'];
            const subjectLabels = ['C. Natureza', 'C. Humanas', 'Linguagens', 'Matemática', 'Redação'];
            
            const regions = ["Zona Sul", "Zona Norte", "Zona Oeste", "Centro"];
            const barDatasets = regions.map(region => {
                const regionData = filteredData.filter(d => d.REGIAO_RJ === region);
                const averages = subjects.map(sub => calculateAverage(regionData, sub));
                return {
                    label: region,
                    data: averages,
                    backgroundColor: regionColors[region].bg,
                    borderColor: regionColors[region].border,
                    borderWidth: 1
                };
            });

            barChartInstance.data.labels = subjectLabels;
            barChartInstance.data.datasets = barDatasets;
            barChartInstance.update();

            // 4.2 Processar Dados para Doughnut Chart (Escolas)
            const publicCount = filteredData.filter(d => d.TP_ESCOLA === 'Pública').length;
            const privateCount = filteredData.filter(d => d.TP_ESCOLA === 'Privada').length;

            doughnutChartInstance.data.labels = ['Pública', 'Privada'];
            doughnutChartInstance.data.datasets[0].data = [publicCount, privateCount];
            doughnutChartInstance.update();

            // 4.3 Processar Dados para Scatter Chart (Matemática x Redação por Região)
            const scatterDatasets = regions.map(region => {
                return {
                    label: region,
                    data: filteredData.filter(d => d.REGIAO_RJ === region).map(d => ({
                        x: d.NU_NOTA_MT,
                        y: d.NU_NOTA_REDACAO
                    })),
                    backgroundColor: regionColors[region].bg,
                    borderColor: regionColors[region].border,
                };
            });

            scatterChartInstance.data.datasets = scatterDatasets;
            scatterChartInstance.update();
        };

        const applyFilters = () => {
            const regionVal = document.getElementById('regionFilter').value;
            const schoolVal = document.getElementById('schoolFilter').value;

            filteredData = rawData.filter(d => {
                const matchRegion = regionVal === "Todas" || d.REGIAO_RJ === regionVal;
                const matchSchool = schoolVal === "Todas" || d.TP_ESCOLA === schoolVal;
                return matchRegion && matchSchool;
            });

            updateKPIs();
            updateCharts();
        };

        /**
         * 5. INICIALIZAÇÃO DO CHART.JS
         */
        const initCharts = () => {
            // Configurações comuns
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#6b7280';

            // Bar Chart
            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: { labels: [], datasets: [] }, // Vazio inicialmente, populado no updateCharts
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 1000 } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            // Doughnut Chart
            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            doughnutChartInstance = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [schoolColors['Pública'].bg, schoolColors['Privada'].bg],
                        borderColor: [schoolColors['Pública'].border, schoolColors['Privada'].border],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            // Scatter Chart
            const ctxScatter = document.getElementById('scatterChart').getContext('2d');
            scatterChartInstance = new Chart(ctxScatter, {
                type: 'scatter',
                data: { datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Nota de Matemática' }, min: 0, max: 1000 },
                        y: { title: { display: true, text: 'Nota da Redação' }, min: 0, max: 1000 }
                    },
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `Mat: ${ctx.raw.x}, Red: ${ctx.raw.y}`
                            }
                        }
                    }
                }
            });
        };

        /**
         * 6. EVENT LISTENERS E BOOTSTRAP DA APLICAÇÃO
         */
        document.getElementById('regionFilter').addEventListener('change', applyFilters);
        document.getElementById('schoolFilter').addEventListener('change', applyFilters);
        document.getElementById('resetFilters').addEventListener('click', () => {
            document.getElementById('regionFilter').value = 'Todas';
            document.getElementById('schoolFilter').value = 'Todas';
            applyFilters();
        });

        // Start
        window.addEventListener('DOMContentLoaded', () => {
            initCharts();
            updateKPIs();
            updateCharts();
        });

    </script>
</body>
</html>
